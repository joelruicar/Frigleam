<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="fridgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#343A4E"/>
      <stop offset="100%" stop-color="#212534"/>
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#fridgeGrad)"/>
  
  <!-- Fridge Body -->
  <rect x="110" y="70" width="292" height="372" rx="32" fill="#FAF7F0" stroke="#FFAFF3" stroke-width="12"/>
  
  <!-- Freezer / Top Door Split Line -->
  <line x1="110" y1="190" x2="402" y2="190" stroke="#292D3E" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Freezer Handle -->
  <rect x="136" y="125" width="18" height="42" rx="9" fill="#FFAFF3" stroke="#292D3E" stroke-width="4"/>
  
  <!-- Main Fridge Handle -->
  <rect x="136" y="215" width="18" height="74" rx="9" fill="#FFAFF3" stroke="#292D3E" stroke-width="4"/>
  
  <!-- Post-it / Shopping note on door -->
  <rect x="220" y="225" width="124" height="140" rx="8" fill="#FFF275" stroke="#292D3E" stroke-width="6" transform="rotate(4 282 295)"/>
  
  <!-- Checklist lines on note -->
  <line x1="240" y1="260" x2="315" y2="265" stroke="#292D3E" stroke-width="5" stroke-linecap="round"/>
  <line x1="240" y1="285" x2="320" y2="291" stroke="#292D3E" stroke-width="5" stroke-linecap="round"/>
  <line x1="240" y1="310" x2="300" y2="314" stroke="#FFAFF3" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Cute magnet pin -->
  <circle cx="282" cy="235" r="10" fill="#FFAFF3" stroke="#292D3E" stroke-width="4"/>
  
  <!-- Fridge feet -->
  <rect x="140" y="440" width="36" height="18" rx="8" fill="#FFAFF3" stroke="#292D3E" stroke-width="6"/>
  <rect x="336" y="440" width="36" height="18" rx="8" fill="#FFAFF3" stroke="#292D3E" stroke-width="6"/>
</svg>
